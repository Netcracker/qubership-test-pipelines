jobs:
  - name: Clean [${service_branch}]
    sequence: install
    restricted: false
    install:
      version: ${service_branch}
      template: templates/redis/redis_clean_deploy.yml
      artifact_name: Clean_CURRENT

  - name: Clean [${service_branch}] in TLS
    sequence: install
    restricted: false
    tls: true
    install:
      version: ${service_branch}
      template: templates/redis/redis_clean_with_tls.yml
      artifact_name: Clean_CURRENT_TLS

  - name: Clean [${service_branch}] W/O Dbaas
    sequence: install
    restricted: false
    install:
      version: ${service_branch}
      template: templates/redis/redis_clean_without_dbaas.yml
      artifact_name: Clean_CURRENT_WO_Dbaas

  - name: Clean [${service_branch}] With Not Default Creds
    sequence: install
    restricted: false
    install:
      version: ${service_branch}
      template: templates/redis/redis_clean_non_default_creds.yml
      artifact_name: Clean_CURRENT_Not_Default_Creds

  - name: Clean [${service_branch}] Restricted
    sequence: install
    restricted: true
    install:
      version: ${service_branch}
      template: templates/redis/redis_clean_deploy.yml
      artifact_name: Clean_CURRENT_Restricted
