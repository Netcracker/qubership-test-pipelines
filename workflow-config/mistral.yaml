jobs:
  ## A special configuration section for generating jobs for installing previous releases on the current version
  - purpose: automation
    name: Clean [${release_version}]. Upgrade to [${service_branch}]
    sequence: upgrade
    restricted: false
    tls: false
    install:
      version: ${release_version}
      template: templates/mistral/mistral_clean.yaml
      artifact_name: Clean_${release_version}_Upgrade_CURRENT
    upgrade:
      version: ${service_branch}
      template: templates/mistral/mistral_clean.yaml
      artifact_name: Clean_${release_version}_Upgrade_CURRENT
  ## ===============================================================================

  - name: Clean [${service_branch}]
    sequence: install
    restricted: false
    tls: false
    install:
      version: ${service_branch}
      template: templates/mistral/mistral_clean.yaml
      artifact_name: Clean_CURRENT

  - name: Clean [${service_branch}]. Upgrade to [${service_branch}] diff params
    sequence: upgrade
    restricted: false
    tls: false
    install:
      version: ${service_branch}
      template: templates/mistral/mistral_clean.yaml
      artifact_name: Clean_CURRENT_Upgrade_CURRENT_Diff_Params
    upgrade:
      version: ${service_branch}
      template: templates/mistral/mistral_clean_updated.yaml
      artifact_name: Clean_CURRENT_Upgrade_CURRENT_Diff_Params

  - name: Clean [${service_branch}] TLS
    sequence: install
    restricted: false
    tls: true
    install:
      version: ${service_branch}
      template: templates/mistral/mistral_tls.yaml
      artifact_name: Clean_CURRENT_TLS

  - name: Clean [${service_branch}] restricted
    sequence: install
    restricted: true
    tls: false
    install:
      version: ${service_branch}
      template: templates/mistral/mistral_clean_restricted.yaml
      artifact_name: Clean_CURRENT_Restricted

  - name: Clean [${service_branch}] without components
    sequence: install
    restricted: false
    tls: false
    install:
      version: ${service_branch}
      template: templates/mistral/mistral_clean_without_components.yaml
      artifact_name: Clean_CURRENT_Without_Components
