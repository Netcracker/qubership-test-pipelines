name: Reusable Mistral Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository with Mistral service
        required: false
        type: string
        default: Netcracker/qubership-mistral
      service_branch:
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Test pipeline branch name
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      verify_timeout_minutes:
        description: Maximum time (in minutes) to wait for each service verification
        type: number
        required: false
        default: 30
  workflow_call:
    inputs:
      repository_name:
        description: Repository with Mistral service
        required: false
        type: string
        default: Netcracker/qubership-mistral
      service_branch:
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Test pipeline branch name
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      verify_timeout_minutes:
        description: Maximum time (in minutes) to wait for each service verification
        type: number
        required: false
        default: 40

jobs:
  prepare:
    if: ${{ !inputs.skip_tests }}
    runs-on: ${{ inputs.runner_type }}
    outputs:
      versions: ${{ steps.process-versions.outputs.versions }}
      matrix: ${{ steps.process-versions.outputs.matrix }}
      service_ready_max_retries: ${{ steps.calc-timeout.outputs.service_ready_max_retries }}
      service_ready_retry_interval: ${{ steps.calc-timeout.outputs.service_ready_retry_interval }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-mistral
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Calculate verify timeout parameters
        id: calc-timeout
        run: |
          RETRY_INTERVAL=10
          MAX_RETRIES=$(( ${{ inputs.verify_timeout_minutes }} * 60 / RETRY_INTERVAL ))
          echo "service_ready_max_retries=$MAX_RETRIES" >> $GITHUB_OUTPUT
          echo "service_ready_retry_interval=${RETRY_INTERVAL}s" >> $GITHUB_OUTPUT

      - name: Get latest tag
        id: get-latest-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repository_name }}
        run: |
          LATEST_TAG=$(gh api repos/${REPO_NAME}/releases/latest --jq '.tag_name')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Process latest tag and matrix generation
        id: process-versions
        env:
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.latest_tag }}
          SERVICE_BRANCH: ${{ inputs.service_branch }}
        working-directory: ${{ github.workspace }}/qubership-test-pipelines
        run: |
          chmod +x ./scripts/matrix.sh
          CONFIG_FILE="./workflow-config/mistral.yaml"
          ./scripts/matrix.sh "$LATEST_TAG" "$CONFIG_FILE" "$SERVICE_BRANCH"

  Mistral-Test-Cases:
    if: ${{ !inputs.skip_tests }}
    needs: prepare
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.test.name }}
    env:
      PG_NAMESPACE: postgres-infra
      PG_REPOSITORY: Netcracker/pgskipper-operator
      PG_CHART: operator/charts/patroni-core
      RABBIT_NAMESPACE: rabbitmq
      RABBIT_REPOSITORY: Netcracker/qubership-rabbitmq
      RABBIT_CHART: operator/charts/helm/rabbitmq
      MISTRAL_NAMESPACE: mistral
      MISTRAL_CHART: operator/deployments/charts/mistral-operator
      SERVICE_READY_MAX_RETRIES: ${{ needs.prepare.outputs.service_ready_max_retries }}
      SERVICE_READY_RETRY_INTERVAL: ${{ needs.prepare.outputs.service_ready_retry_interval }}
    steps:
      # == 01 Start ======= Common pre-steps for all tests =======
      - name: Print job parameters
        env:
          MATRIX_JSON: ${{ toJson(matrix.test) }}
        run: |
          echo "======== Job parameters ======="
          echo "$MATRIX_JSON"

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Create cluster
        uses: ./qubership-test-pipelines/actions/shared/create_cluster
      # == 01 End ======= Common pre-steps for all tests =======

      # == 02 Start ======= PostgreSQL dependency (main) =======
      - name: Install PostgreSQL
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: postgres_install
        with:
          path_to_template: templates/pgskipper/patroni-core-lite.yaml
          service_branch: main
          restricted: false
          service_name: pg-patroni
          repository_name: ${{ env.PG_REPOSITORY }}
          path_to_chart: ${{ env.PG_CHART }}
          namespace: ${{ env.PG_NAMESPACE }}

      - name: Verify PostgreSQL installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.PG_NAMESPACE }}
          service_ready_max_retries: ${{ env.SERVICE_READY_MAX_RETRIES }}
          service_ready_retry_interval: ${{ env.SERVICE_READY_RETRY_INTERVAL }}
          check_tests: false

      - name: Collect Diagnostics PostgreSQL installation
        if: ${{ !cancelled() && steps.postgres_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.PG_NAMESPACE }}
          artifact_name: PostgreSQL_Installation
          service_branch: main
      # == 02 End ======= PostgreSQL dependency =======

      # == 03 Start ======= RabbitMQ dependency (main) =======
      - name: Install RabbitMQ
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: rabbitmq_install
        with:
          path_to_template: templates/rabbitmq-service/rabbitmq_clean_sc_lite.yml
          service_branch: main
          restricted: false
          service_name: rabbitmq
          repository_name: ${{ env.RABBIT_REPOSITORY }}
          path_to_chart: ${{ env.RABBIT_CHART }}
          namespace: ${{ env.RABBIT_NAMESPACE }}

      - name: Verify RabbitMQ installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.RABBIT_NAMESPACE }}
          service_ready_max_retries: ${{ env.SERVICE_READY_MAX_RETRIES }}
          service_ready_retry_interval: ${{ env.SERVICE_READY_RETRY_INTERVAL }}
          check_tests: false

      - name: Collect Diagnostics RabbitMQ installation
        if: ${{ !cancelled() && steps.rabbitmq_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.RABBIT_NAMESPACE }}
          artifact_name: RabbitMQ_Installation
          service_branch: main
      # == 03 End ======= RabbitMQ dependency =======

      # == 04 Start ======= Mistral installation =======
      - name: Print Mistral install deployment parameters
        run: cat qubership-test-pipelines/${{ matrix.test.install.template }}

      - name: Install Mistral [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: mistral_install
        with:
          path_to_template: ${{ matrix.test.install.template }}
          service_branch: ${{ matrix.test.install.version }}
          restricted: ${{ matrix.test.restricted }}
          service_name: mistral-operator
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.MISTRAL_CHART }}
          namespace: ${{ env.MISTRAL_NAMESPACE }}

      - name: Get Installed Mistral CRD name
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_mistral_get_crds
        with:
          crd_location: ${{ inputs.repository_name }}/${{ env.MISTRAL_CHART }}/crds

      - name: Verify Mistral installation [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.MISTRAL_NAMESPACE }}
          service_ready_max_retries: ${{ env.SERVICE_READY_MAX_RETRIES }}
          service_ready_retry_interval: ${{ env.SERVICE_READY_RETRY_INTERVAL }}
          test_completion_max_retries: 90
          test_completion_retry_interval: 10s
          crd_list: ${{ steps.install_mistral_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics Mistral installation [${{ matrix.test.install.version }}]
        if: ${{ !cancelled() && steps.mistral_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.MISTRAL_NAMESPACE }}
          artifact_name: Mistral_Installation_${{ matrix.test.install.artifact_name }}
          crd_list: ${{ steps.install_mistral_get_crds.outputs.crd_names }}
          service_branch: ${{ matrix.test.install.version }}
      # == 04 End ======= Mistral installation =======

  final-status-check:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [Mistral-Test-Cases]
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false
      - name: Check job status
        uses: ./qubership-test-pipelines/actions/shared/check_job_status
        with:
          job_result: ${{ needs.Mistral-Test-Cases.result }}
