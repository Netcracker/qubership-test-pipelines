name: Reusable ClickHouse Tests

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository with ClickHouse operator
        required: false
        type: string
        default: Netcracker/qubership-clickhouse-operator-helm
      service_branch:
        description: Branch of qubership-clickhouse-operator-helm repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      scope:
        description: ClickHouse Test Scope (pr or nightly)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      repository_name:
        description: Repository with ClickHouse operator
        required: false
        type: string
        default: Netcracker/qubership-clickhouse-operator-helm
      service_branch:
        description: Branch of qubership-clickhouse-operator-helm repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      scope:
        description: ClickHouse Test Scope (pr or nightly)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false

    secrets:
      AWS_S3_ACCESS_KEY_ID:
        required: true
      AWS_S3_ACCESS_KEY_SECRET:
        required: true

env:
  namespace: clickhouse
  path_to_chart_operator: helm/clickhouse
  path_to_chart_services: helm/clickhouse-services

jobs:
  prepare:
    if: ${{ !inputs.skip_tests }}
    runs-on: ${{ inputs.runner_type }}
    outputs:
      versions: ${{ steps.process-versions.outputs.versions }}
      matrix: ${{ steps.process-versions.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-clickhouse-operator-helm
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Get latest tag
        id: get-latest-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repository_name }}
        run: |
          LATEST_TAG=$(gh api repos/${REPO_NAME}/releases/latest --jq '.tag_name')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Process versions file and matrix generation
        id: process-versions
        env:
          SCOPE: ${{ inputs.scope }}
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.latest_tag }}
          SERVICE_BRANCH: ${{ inputs.service_branch }}
        working-directory: ${{ github.workspace }}/qubership-test-pipelines
        run: |
          chmod +x ./scripts/matrix.sh
          if [[ "$SCOPE" == "nightly" ]]; then
            CONFIG_FILE="./workflow-config/clickhouse_nightly.yaml"
          elif [[ "$SCOPE" == "pr" ]]; then
            CONFIG_FILE="./workflow-config/clickhouse.yaml"
          else
            echo "::error::Invalid scope parameter '$SCOPE'. Must be 'pr' or 'nightly'"
            exit 1
          fi
          ./scripts/matrix.sh "$LATEST_TAG" "$CONFIG_FILE" "$SERVICE_BRANCH"

  ClickHouse-Test-Cases:
    if: ${{ !inputs.skip_tests }}
    needs: prepare
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.test.name }}
    steps:
      # == 01 Start ======= Common pre-steps for all tests =======
      - name: Print job parameters
        env:
          MATRIX_JSON: ${{ toJson(matrix.test) }}
        run: |
          echo "======== Job parameters ======="
          echo "$MATRIX_JSON"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-clickhouse-operator-helm
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Create cluster
        uses: ./qubership-test-pipelines/actions/shared/create_cluster
      # == 01 End ======= Common pre-steps for all tests =======

      # == Start Monitoring installation tests =======
      - name: Install Monitoring [${{ matrix.test.install.version }}]
        if: matrix.test.monitoring == true
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: monitoring_install
        with:
          path_to_template: templates/monitoring/vm_without_tests.yml
          service_branch: v0.88.0
          service_name: monitoring
          repository_name: Netcracker/qubership-monitoring-operator
          path_to_chart: charts/qubership-monitoring-operator
          namespace: monitoring
          restricted: false

      - name: Get Installed Monitoring CR name
        if: matrix.test.monitoring == true
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_monitoring_get_crds
        with:
          crd_location: Netcracker/qubership-monitoring-operator/charts/qubership-monitoring-operator/crds

      - name: Verify Monitoring installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        if: matrix.test.monitoring == true
        with:
          namespace: monitoring
          test_completion_max_retries: 40
          test_completion_retry_interval: 10s
          service_ready_max_retries: 80
          service_ready_retry_interval: 10s
          monitoring_pipeline: true
          repository_name: Netcracker/qubership-monitoring-operator
          crd_list: ${{ steps.install_monitoring_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics Monitoring installation
        if: ${{ !cancelled() && steps.monitoring_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: monitoring
          artifact_name: Install_Monitoring_${{ matrix.test.install.artifact_name }}
          service_branch: main
          crd_list: ${{ steps.install_monitoring_get_crds.outputs.crd_names }}
      # == End Monitoring installation tests =======

      # == Start ======= ClickHouse-specific dependency: ZooKeeper =======
      - name: Print Zookeeper install deployment parameters
        if: matrix.test.zookeeper == true
        run: cat qubership-test-pipelines/templates/zookeeper-service/zookeeper_install_APP_k8s.yml

      - name: Clean Install Zookeeper [LATEST]
        if: matrix.test.zookeeper == true
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: zoo_install
        with:
          path_to_template: templates/zookeeper-service/zookeeper_install_APP_k8s.yml
          service_branch: main
          service_name: zookeeper-service
          repository_name: Netcracker/qubership-zookeeper
          path_to_chart: operator/charts/helm/zookeeper-service
          namespace: zookeeper

      - name: Get Installed Zookeeper CRD name
        if: matrix.test.zookeeper == true
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_zoo_get_crds
        with:
          crd_location: Netcracker/qubership-zookeeper/operator/charts/helm/zookeeper-service/crds

      - name: Verify Zookeeper installation
        if: matrix.test.zookeeper == true
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: zookeeper
          service_ready_max_retries: 80
          service_ready_retry_interval: 10s
          repository_name: Netcracker/qubership-zookeeper
          crd_list: ${{ steps.install_zoo_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics Zookeeper installation
        if: ${{ !cancelled() && steps.zoo_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: zookeeper
          artifact_name: Install_Zookeeper_${{ matrix.test.install.artifact_name }}
          service_branch: main
          crd_list: ${{ steps.install_zoo_get_crds.outputs.crd_names }}
      # == End ======= ClickHouse-specific dependency: ZooKeeper =======

      # == Start ======= Specific steps for TLS =======
      - name: Setup TLS
        if: matrix.test.tls == true
        uses: ./qubership-test-pipelines/actions/shared/setup_tls
      # == End ======= Specific steps for TLS =======

      # == Start ======= Specific steps for S3 =======
      - name: Create S3 bucket
        id: create_bucket
        if: matrix.test.install.s3 == true
        uses: ./qubership-test-pipelines/actions/shared/setup_s3_bucket
        with:
          aws_access_key_id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}
          region: us-east-1
          prefix: clickhouse

      - name: Add S3 secrets to ClickHouse templates
        if: matrix.test.install.s3 == true
        env:
          ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}
          BUCKET_NAME: ${{ steps.create_bucket.outputs.bucket_name }}
          TEMPLATE_OPERATOR: ${{ matrix.test.install.template_operator }}
          TEMPLATE_SERVICES: ${{ matrix.test.install.template_services }}
        # zizmor: ignore[template-injection]
        run: |
          for template in "$TEMPLATE_OPERATOR" "$TEMPLATE_SERVICES"; do
            echo "Updating S3 settings in ${template}"
            python qubership-test-pipelines/scripts/update_yaml.py \
              --file="qubership-test-pipelines/${template}" \
              --path='backupDaemon/storage/s3/access_key' --value="$ACCESS_KEY"
            python qubership-test-pipelines/scripts/update_yaml.py \
              --file="qubership-test-pipelines/${template}" \
              --path='backupDaemon/storage/s3/secret_key' --value="$SECRET_KEY"
            python qubership-test-pipelines/scripts/update_yaml.py \
              --file="qubership-test-pipelines/${template}" \
              --path='backupDaemon/storage/s3/bucket' --value="$BUCKET_NAME"
          done

          # Workaround for the chart bug in
          # helm/clickhouse/templates/clickhouse-backup-daemon/clickhouse-backup-daemon-config.yaml:
          # the `s3:` block is rendered on a single line (`{{ $value -}}` trims the newline), so
          # only `access_key` survives and clickhouse-backup fails with
          # "static credentials are empty". clickhouse-backup env variables override the config file.
          echo "Setting S3 envs in ${TEMPLATE_OPERATOR} (clickhouse-backup env overrides)"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_OPERATOR}" \
            --path='backupDaemon/envs/S3_ACCESS_KEY' --value="$ACCESS_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_OPERATOR}" \
            --path='backupDaemon/envs/S3_SECRET_KEY' --value="$SECRET_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_OPERATOR}" \
            --path='backupDaemon/envs/S3_BUCKET' --value="$BUCKET_NAME"

          # clickhouse-backup builds the S3 client for some code paths (granular backup,
          # .evictlock handling) through the AWS default credential chain, which reads AWS_* only
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_OPERATOR}" \
            --path='backupDaemon/envs/AWS_ACCESS_KEY_ID' --value="$ACCESS_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_OPERATOR}" \
            --path='backupDaemon/envs/AWS_SECRET_ACCESS_KEY' --value="$SECRET_KEY"

          # The orchestrator handles granular backups and .evictlock and builds its own S3 client
          # from env only: without these variables /backup fails with "static credentials are empty"
          echo "Setting S3 envs in ${TEMPLATE_SERVICES} (orchestrator)"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_SERVICES}" \
            --path='backupDaemon/orchestrator/envs/S3_ACCESS_KEY' --value="$ACCESS_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_SERVICES}" \
            --path='backupDaemon/orchestrator/envs/S3_SECRET_KEY' --value="$SECRET_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_SERVICES}" \
            --path='backupDaemon/orchestrator/envs/AWS_ACCESS_KEY_ID' --value="$ACCESS_KEY"
          python qubership-test-pipelines/scripts/update_yaml.py \
            --file="qubership-test-pipelines/${TEMPLATE_SERVICES}" \
            --path='backupDaemon/orchestrator/envs/AWS_SECRET_ACCESS_KEY' --value="$SECRET_KEY"
      # == End ======= Specific steps for S3 =======

      # == 02 Start ===== Install ClickHouse Operator + Cluster =====
      - name: Print operator install deployment parameters
        run: cat qubership-test-pipelines/${{ matrix.test.install.template_operator }}

      - name: Install ClickHouse Operator [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: clickhouse_operator_install
        with:
          path_to_template: ${{ matrix.test.install.template_operator }}
          service_branch: ${{ matrix.test.install.version }}
          deploy_mode: install
          service_name: clickhouse-operator
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_operator }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Get Installed ClickHouse Operator CRD name
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_clickhouse_operator_get_crds
        with:
          crd_location: Netcracker/qubership-clickhouse-operator-helm/helm/clickhouse/crds

      - name: Verify ClickHouse Operator installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 150
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_clickhouse_operator_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics ClickHouse Operator installation
        if: ${{ !cancelled() && steps.clickhouse_operator_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: ClickHouse_Operator_Install_${{ matrix.test.install.artifact_name }}
          service_branch: ${{ matrix.test.install.version }}
          crd_list: ${{ steps.install_clickhouse_operator_get_crds.outputs.crd_names }}
      # == 02 End ===== Install ClickHouse Operator + Cluster =====

      # == 03 Start ===== Install ClickHouse Services =====
      - name: Print services install deployment parameters
        # zizmor: ignore[template-injection]
        run: cat qubership-test-pipelines/${{ matrix.test.install.template_services }}

      - name: Install ClickHouse Services [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: clickhouse_services_install
        with:
          path_to_template: ${{ matrix.test.install.template_services }}
          service_branch: ${{ matrix.test.install.version }}
          deploy_mode: install
          service_name: clickhouse-services
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_services }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Verify ClickHouse Services installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s

      - name: Collect Diagnostics ClickHouse Services installation
        if: ${{ !cancelled() && steps.clickhouse_services_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: ClickHouse_Services_Install_${{ matrix.test.install.artifact_name }}
          service_branch: ${{ matrix.test.install.version }}
      # == 03 End ===== Install ClickHouse Services =====

      # == Start ======= Debug: ClickHouse cluster =======
      - name: Debug ClickHouse resources
        if: always()
        shell: bash
        run: |
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.namespace }} -o wide || true
          echo "=== ClickHouseInstallations ==="
          kubectl get clickhouseinstallations -n ${{ env.namespace }} || true
          echo "=== Services ==="
          kubectl get svc -n ${{ env.namespace }} || true
      # == End ======= Debug: ClickHouse cluster =======

      # == Start ======= Debug: S3 backup credentials =======
      - name: Debug S3 backup credentials
        if: always() && matrix.test.install.s3 == true
        shell: bash
        run: |
          ns="${{ env.namespace }}"

          echo "=== Secrets with s3 in name ==="
          kubectl get secrets -n "$ns" | grep -i s3 || true

          for s in s3-remote-storage-credentials s3-remote-storage-credentials-ch-backup; do
            echo "=== Secret $s (value length after base64 decode) ==="
            kubectl get secret "$s" -n "$ns" -o json 2>/dev/null \
              | jq -r '.data // {} | to_entries[] | "\(.key): len=\(.value | @base64d | length)"' || true
          done

          echo "=== Helm releases and their backupDaemon.storage values ==="
          helm list -n "$ns" || true
          for rel in $(helm list -n "$ns" -q); do
            echo "--- $rel ---"
            helm get values "$rel" -n "$ns" -o json 2>/dev/null | jq -c '.backupDaemon.storage // empty' || true
          done

          echo "=== Backup pods ==="
          kubectl get pods -n "$ns" -o wide | grep -i backup || true

          for pod in $(kubectl get pods -n "$ns" --no-headers -o custom-columns=:metadata.name | grep -i backup); do
            echo "--- $pod: env ---"
            kubectl exec -n "$ns" "$pod" -- sh -c 'env | grep -i -E "s3|remote|storage" | sed -E "s/(SECRET|KEY|PASSWORD)=.*/\1=***/"' || true
            echo "--- $pod: mounted s3 credentials ---"
            kubectl exec -n "$ns" "$pod" -- sh -c 'for f in /var/run/secrets/clickhouse/s3-remote-storage-credentials/*; do [ -f "$f" ] && echo "$f: $(wc -c < "$f") bytes"; done' || true
            echo "--- $pod: clickhouse-backup config (masked) ---"
            kubectl exec -n "$ns" "$pod" -- sh -c 'for p in /etc/clickhouse-backup/config.yml /etc/clickhouse-backup/config.yaml /etc/clickhouse-backup/clickhouse-backup-config.yaml; do [ -f "$p" ] && echo "path: $p" && sed -E "s/(access_key|secret_key)([[:space:]]*):.*/\1\2: ***/" "$p"; done' || true

            echo "--- $pod: logs (last 200 lines) ---"
            kubectl logs -n "$ns" "$pod" --tail=200 2>&1 | tail -n 200 || true

            echo "--- $pod: S3/AWS/evictlock strings inside the binary ---"
            kubectl exec -n "$ns" "$pod" -- sh -c '
              for b in /usr/local/bin/clickhouse-backup-orchestrator /app/clickhouse-backup-orchestrator /usr/local/bin/orchestrator; do
                if [ -f "$b" ]; then
                  echo "BIN: $b"
                  grep -aoE "S3_[A-Za-z0-9_]+|AWS_[A-Za-z0-9_]+|evictlock|granular" "$b" | sort -u | head -n 60
                fi
              done' || true
          done

          echo "=== ClickHouse pods: containers, mounts and backup daemon config ==="
          for pod in $(kubectl get pods -n "$ns" --no-headers -o custom-columns=:metadata.name | grep -i '^chi-'); do
            echo "--- $pod: images ---"
            kubectl get pod "$pod" -n "$ns" -o json \
              | jq -r '.spec.containers[] | "\(.name) = \(.image)"'

            echo "--- $pod: containers and volume mounts ---"
            kubectl get pod "$pod" -n "$ns" -o json \
              | jq -r '.spec.containers[] | "\(.name): " + ((.volumeMounts // []) | map(.mountPath) | join(", "))'

            for c in $(kubectl get pod "$pod" -n "$ns" -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}'); do
              echo "--- $pod/$c: clickhouse-backup config ---"
              echo "CLICKHOUSE_BACKUP_CONFIG: $(kubectl exec -n "$ns" "$pod" -c "$c" -- sh -c 'echo $CLICKHOUSE_BACKUP_CONFIG' 2>/dev/null)"
              kubectl exec -n "$ns" "$pod" -c "$c" -- sh -c 'ls -la /backup-config /etc/clickhouse-backup 2>/dev/null; for p in /backup-config/clickhouse-backup-config.yaml /etc/clickhouse-backup/config.yml; do [ -f "$p" ] && echo "PATH: $p" && cat "$p"; done' \
                || echo "exec failed: $pod/$c"
              echo "--- $pod/$c: s3/remote env ---"
              kubectl exec -n "$ns" "$pod" -c "$c" -- sh -c 'env | grep -i -E "s3|remote|storage" | sed -E "s/(SECRET|KEY|PASSWORD)=.*/\1=***/"' \
                || echo "exec failed: $pod/$c"
            done
          done

          echo "=== ConfigMaps/secrets with backup in name ==="
          kubectl get cm,secret -n "$ns" | grep -i backup || true

          echo "=== ConfigMap clickhouse-backup-config.yaml (masked) ==="
          kubectl get cm clickhouse-backup-config.yaml -n "$ns" -o yaml 2>/dev/null \
            | sed -E "s/(access_key|secret_key)([[:space:]]*):.*/\1\2: ***/" || true

          echo "=== clickhouse-backup daemon: logs / print-config / mounted creds ==="
          for pod in $(kubectl get pods -n "$ns" --no-headers -o custom-columns=:metadata.name | grep -i '^chi-'); do
            echo "--- $pod/clickhouse-backup: last 100 log lines ---"
            kubectl logs -n "$ns" "$pod" -c clickhouse-backup --tail=100 2>&1 \
              | sed -E "s/(AKIA[0-9A-Z]{16})/***/g; s/(secret[^ ]*|Secret[^ ]*)[=:][^ ]+/\1=***/g" || true

            echo "--- $pod/clickhouse-backup: clickhouse-backup print-config (masked) ---"
            kubectl exec -n "$ns" "$pod" -c clickhouse-backup -- clickhouse-backup print-config 2>&1 \
              | sed -E "s/(access_key|secret_key)([[:space:]]*):.*/\1\2: ***/; s/(AKIA[0-9A-Z]{16})/***/g" || true

            echo "--- $pod/clickhouse-backup: mounted s3 credentials ---"
            kubectl exec -n "$ns" "$pod" -c clickhouse-backup -- \
              sh -c 'ls -l /var/run/secrets/clickhouse/s3-remote-storage-credentials-ch-backup 2>/dev/null; for f in /var/run/secrets/clickhouse/s3-remote-storage-credentials-ch-backup/*; do [ -f "$f" ] && echo "$f: $(wc -c < "$f") bytes"; done' || true

            echo "--- $pod/clickhouse-backup: probe remote storage (list remote) ---"
            kubectl exec -n "$ns" "$pod" -c clickhouse-backup -- \
              clickhouse-backup list remote 2>&1 | tail -n 20 \
              | sed -E "s/(AKIA[0-9A-Z]{16})/***/g" || true
          done
      # == End ======= Debug: S3 backup credentials =======

      # == Start ======= Specific steps for S3 =======
      - name: Delete S3 bucket
        if: always() && matrix.test.install.s3 == true
        uses: ./qubership-test-pipelines/actions/shared/cleanup_s3_bucket
        with:
          aws_access_key_id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}
          bucket_name: ${{ steps.create_bucket.outputs.bucket_name }}
          region: us-east-1
      # == End ======= Specific steps for S3 =======

      # == 04 Start ===== Upgrade ClickHouse Operator =====
      - name: Upgrade ClickHouse Operator to [${{ matrix.test.upgrade.version }}]
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: clickhouse_operator_upgrade
        with:
          path_to_template: ${{ matrix.test.upgrade.template_operator }}
          service_branch: ${{ matrix.test.upgrade.version }}
          deploy_mode: upgrade
          service_name: clickhouse-operator
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_operator }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Verify ClickHouse Operator upgrade
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_clickhouse_operator_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics ClickHouse Operator upgrade
        if: ${{ !cancelled() && steps.clickhouse_operator_upgrade.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: ClickHouse_Operator_Upgrade_${{ matrix.test.upgrade.artifact_name }}
          service_branch: ${{ matrix.test.upgrade.version }}
          crd_list: ${{ steps.install_clickhouse_operator_get_crds.outputs.crd_names }}
      # == 04 End ===== Upgrade ClickHouse Operator =====

      # == 05 Start ===== Upgrade ClickHouse Services =====
      - name: Upgrade ClickHouse Services to [${{ matrix.test.upgrade.version }}]
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: clickhouse_services_upgrade
        with:
          path_to_template: ${{ matrix.test.upgrade.template_services }}
          service_branch: ${{ matrix.test.upgrade.version }}
          deploy_mode: upgrade
          service_name: clickhouse-services
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_services }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Verify ClickHouse Services upgrade
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s

      - name: Collect Diagnostics ClickHouse Services upgrade
        if: ${{ !cancelled() && steps.clickhouse_services_upgrade.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: ClickHouse_Services_Upgrade_${{ matrix.test.upgrade.artifact_name }}
          service_branch: ${{ matrix.test.upgrade.version }}
      # == 05 End ===== Upgrade ClickHouse Services =====

  final-status-check:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [ClickHouse-Test-Cases]
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false
      - name: Check job status
        uses: ./qubership-test-pipelines/actions/shared/check_job_status
        with:
          job_result: ${{ needs.ClickHouse-Test-Cases.result }}
