name: Service Status

on:
  push: null
  workflow_dispatch:
    inputs:
      services:
        description: >-
          Comma-separated list of service names to analyse (case-insensitive), or "all" to analyse
          every service of workflow-config/service-status.yaml
        required: false
        type: string
        default: all

permissions:
  contents: read

env:
  # The services that are analysed by default (all services of workflow-config/service-status.yaml
  # at the moment). Keep the list in sync with that config: a service that is missing here is not
  # analysed when the `services` input keeps its default value.
  ALL_SERVICES: >-
    Consul, ZooKeeper, Kafka, RabbitMQ, OpenSearch, Monitoring, PG skipper

jobs:
  service-status:
    name: Build service status report
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build service status report
        id: build-report
        env:
          # "all" (the default of the input) selects every service; an empty value comes from the
          # push trigger, which has no inputs, so it also analyses every service.
          SERVICES_FILTER: ${{ inputs.services == 'all' && env.ALL_SERVICES || inputs.services }}
        run: |
          chmod +x scripts/service_status_report.sh
          ./scripts/service_status_report.sh \
            workflow-config/service-status.yaml \
            service-status-report.md \
            "${SERVICES_FILTER}"

      - name: Upload status report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-status-report
          path: service-status-report.md
          retention-days: 7
