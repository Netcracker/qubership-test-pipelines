name: Reusable Monitoring Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository with Monitoring service
        required: false
        type: string
        default: Netcracker/qubership-monitoring-operator
      service_branch:
        description: Branch of qubership-monitoring-operator repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      kind-layout:
        description: Kind cluster layout (single-node or multi-node)
        type: string
        required: false
        default: multi-node
      enable-owner-references-permission-enforcement:
        description: Enable OwnerReferencesPermissionEnforcement in the Kind API server
        type: boolean
        required: false
        default: false
      cluster_engine:
        description: Cluster engine to run the tests on (kind or microshift)
        type: string
        required: false
        default: kind
      scope:
        description: Monitoring Test Scope (pr, nightly or hardening)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      allure:
        description: Enable Allure report generation
        type: boolean
        required: false
        default: true
      verify_timeout_minutes:
        description: Maximum time (in minutes) to wait for each service verification
        type: number
        required: false
        default: 15

  workflow_call:
    inputs:
      repository_name:
        description: Repository with Monitoring service
        required: false
        type: string
        default: Netcracker/qubership-monitoring-operator
      service_branch:
        description: Branch of qubership-monitoring-operator repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      kind-layout:
        description: Kind cluster layout (single-node or multi-node)
        type: string
        required: false
        default: multi-node
      enable-owner-references-permission-enforcement:
        description: Enable OwnerReferencesPermissionEnforcement in the Kind API server
        type: boolean
        required: false
        default: false
      cluster_engine:
        description: Cluster engine to run the tests on (kind or microshift)
        type: string
        required: false
        default: kind
      scope:
        description: Monitoring Test Scope (pr, nightly or hardening)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      verify_timeout_minutes:
        description: Maximum time (in minutes) to wait for each service verification
        type: number
        required: false
        default: 15
      allure:
        description: Enable Allure report generation
        type: boolean
        required: false
        default: true

    secrets:
      AWS_S3_ACCESS_KEY_ID:
        required: false
      AWS_S3_ACCESS_KEY_SECRET:
        required: false

jobs:
  prepare:
    if: ${{ !inputs.skip_tests }}
    runs-on: ${{ inputs.runner_type }}
    outputs:
      versions: ${{ steps.process-versions.outputs.versions }}
      matrix: ${{ steps.process-versions.outputs.matrix }}
      service_ready_max_retries: ${{ steps.calc-timeout.outputs.service_ready_max_retries }}
      service_ready_retry_interval: ${{ steps.calc-timeout.outputs.service_ready_retry_interval }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-monitoring-operator
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: ${{ github.repository_owner }}/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false


      - name: Calculate verify timeout parameters
        id: calc-timeout
        run: |
          RETRY_INTERVAL=10
          MAX_RETRIES=$(( ${{ inputs.verify_timeout_minutes }} * 60 / RETRY_INTERVAL ))
          echo "service_ready_max_retries=$MAX_RETRIES" >> $GITHUB_OUTPUT
          echo "service_ready_retry_interval=${RETRY_INTERVAL}s" >> $GITHUB_OUTPUT

      - name: Get latest tag
        id: get-latest-tag
        run: |
          echo "latest_tag=main" >> $GITHUB_OUTPUT

      - name: Process versions file and matrix generation
        id: process-versions
        env:
          SCOPE: ${{ inputs.scope }}
          CLUSTER_ENGINE: ${{ inputs.cluster_engine }}
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.latest_tag }}
          SERVICE_BRANCH: ${{ inputs.service_branch }}
        working-directory: ${{ github.workspace }}/qubership-test-pipelines
        run: |
          chmod +x ./scripts/matrix.sh
          if [[ "$CLUSTER_ENGINE" == "microshift" ]]; then
            # The OpenShift/MicroShift scenario is a distinct test matrix (Gateway API
            # instead of Ingress), independent of the pr/nightly/hardening scope split.
            CONFIG_FILE="./workflow-config/monitoring_openshift.yaml"
          elif [[ "$SCOPE" == "nightly" ]]; then
            CONFIG_FILE="./workflow-config/monitoring_nightly.yaml"
          elif [[ "$SCOPE" == "pr" ]]; then
            CONFIG_FILE="./workflow-config/monitoring.yaml"
          elif [[ "$SCOPE" == "hardening" ]]; then
            CONFIG_FILE="./workflow-config/monitoring_hardening.yaml"
          else
            echo "::error::Invalid scope parameter '$SCOPE'. Must be 'pr', 'nightly' or 'hardening'."
            exit 1
          fi
          ./scripts/matrix.sh "$LATEST_TAG" "$CONFIG_FILE" "$SERVICE_BRANCH"

  Monitoring-Test-Cases:
    if: ${{ !inputs.skip_tests }}
    needs: prepare
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.test.name }}
    env:
      PATH_TO_CHART: charts/qubership-monitoring-operator
      SERVICE_READY_MAX_RETRIES: ${{ needs.prepare.outputs.service_ready_max_retries }}
      SERVICE_READY_RETRY_INTERVAL: ${{ needs.prepare.outputs.service_ready_retry_interval }}
      TEST_COMPLETION_MAX_RETRIES: 100
      TEST_COMPLETION_RETRY_INTERVAL: 5s
    steps:
      # == 01 Start ======= Common pre-steps for all tests =======
      - name: Print job parameters
        env:
          MATRIX_JSON: ${{ toJson(matrix.test) }}
        run: |
          echo "======== Job parameters ======="
          echo "$MATRIX_JSON"

      - name: Checkout pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: ${{ github.repository_owner }}/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Create cluster (Kind)
        if: inputs.cluster_engine != 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/create_cluster
        with:
          kind-layout: ${{ inputs.kind-layout }}
          enable-owner-references-permission-enforcement: ${{ inputs.enable-owner-references-permission-enforcement }}

      - name: Create cluster (OpenShift/MicroShift)
        if: inputs.cluster_engine == 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/create_cluster_openshift

      # == Start ======= Specific steps for Allure report =======
      - name: Check Allure configuration
        if: matrix.test.allure == true && inputs.allure == false
        run: echo "::warning::Allure report generation has been forcibly disabled by the calling workflow (inputs.allure = false)"

      - name: Add s3 backet for Allure report
        if: matrix.test.allure == true && inputs.allure == true
        run: >-
          python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template }}'
          --path='integrationTests/atpReport/enabled'
          --value='true'
          && python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template }}'
          --path='integrationTests/atpReport/atpStorage/username'
          --value='${{secrets.AWS_S3_ACCESS_KEY_ID}}'
          && python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template }}'
          --path='integrationTests/atpReport/atpStorage/password'
          --value='${{secrets.AWS_S3_ACCESS_KEY_SECRET}}'
      # == End ======= Specific steps for Allure report =======

      - name: Install Ingress Controller (Kind)
        if: inputs.cluster_engine != 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/create_ingress

      # == Start ======= OpenShift/MicroShift: Gateway API instead of Ingress =======
      - name: Setup TLS (cert-manager + self-signed ClusterIssuer)
        if: inputs.cluster_engine == 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/setup_tls

      - name: Create monitoring namespace
        if: inputs.cluster_engine == 'microshift'
        run: kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Request wildcard certificate for the Gateway
        if: inputs.cluster_engine == 'microshift'
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata:
            name: monitoring-gateway-tls
            namespace: monitoring
          spec:
            secretName: monitoring-gateway-tls
            dnsNames:
              - "*.testdomain.local"
            issuerRef:
              name: test-clusterissuer
              kind: ClusterIssuer
              group: cert-manager.io
          EOF
          kubectl wait --for=condition=Ready certificate/monitoring-gateway-tls -n monitoring --timeout=60s

      - name: Install Gateway API Gateway (OpenShift/MicroShift)
        if: inputs.cluster_engine == 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/create_gateway
        with:
          tls-secret-name: monitoring-gateway-tls

      - name: Provision etcd certs for OpenShift/MicroShift
        if: inputs.cluster_engine == 'microshift'
        uses: ./qubership-test-pipelines/actions/shared/provision_etcd_certs_openshift
      # == End ======= OpenShift/MicroShift: Gateway API instead of Ingress =======
      # == 01 End ======= Common pre-steps for all tests =======

      - name: Print clean install deployment parameters
        run: cat qubership-test-pipelines/${{ matrix.test.install.template }}

      # == 02 Start ======= Installation steps =======
      - name: Install Monitoring [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: monitoring_install
        with:
          path_to_template: ${{ matrix.test.install.template }}
          service_branch: ${{ matrix.test.install.version }}
          service_name: monitoring
          repository_name: ${{ inputs.repository_name }}
          PATH_TO_CHART: charts/qubership-monitoring-operator
          namespace: monitoring
          restricted: ${{ matrix.test.restricted }}

      - name: Get Installed Monitoring CR name
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_monitoring_get_crds
        with:
          crd_location: ${{ inputs.repository_name}}/${{ env.PATH_TO_CHART}}/crds

      - name: Verify Monitoring installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: monitoring
          service_ready_max_retries: ${{ env.SERVICE_READY_MAX_RETRIES }}
          service_ready_retry_interval: ${{ env.SERVICE_READY_RETRY_INTERVAL }}
          test_completion_max_retries: ${{ env.TEST_COMPLETION_MAX_RETRIES }}
          test_completion_retry_interval: ${{ env.TEST_COMPLETION_RETRY_INTERVAL }}
          crd_list: ${{ steps.install_monitoring_get_crds.outputs.crd_names }}
          monitoring_pipeline: true
          repository_name: ${{ inputs.repository_name }}

      - name: Collect Diagnostics Monitoring installation
        if: ${{ !cancelled() && steps.monitoring_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: monitoring
          artifact_name: Installation_${{ matrix.test.install.artifact_name }}
          service_branch: ${{ matrix.test.install.version }}

      # == 02 End ======= Installation steps =======

      # == Start ======= Specific steps for upgrade tests =======
      - name: Print upgrade deployment parameters
        if: ${{ matrix.test.sequence == 'upgrade' }}
        run: cat qubership-test-pipelines/${{ matrix.test.upgrade.template }}

      - name: Upgrade Monitoring to [${{ matrix.test.upgrade.version }}]
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: monitoring_upgrade
        with:
          path_to_template: ${{ matrix.test.upgrade.template }}
          service_branch: ${{ matrix.test.upgrade.version }}
          deploy_mode: upgrade
          service_name: monitoring
          repository_name: ${{ inputs.repository_name }}
          PATH_TO_CHART: charts/qubership-monitoring-operator
          namespace: monitoring
          restricted: ${{ matrix.test.restricted }}

      - name: Sleep 2m
        if: matrix.test.sequence == 'upgrade'
        run: sleep 2m

      - name: Hardening Check
        if: inputs.scope == 'hardening'
        uses: netcracker/qubership-workflow-hub/actions/k8s-hardening-scan@8c6dbeb901920bae9f40d7d7b646d8d9127e1ce7 # v2.4.0
        with:
          namespaces: monitoring
          output-file: monitoring-hardening-scan.json
          install-kubescape: true
          execute-trivy-scan: true
          fail-on-mandatory-checks: true
          config-file: ${{ inputs.repository_name }}/.github/hardening-config.yaml

      - name: Get Upgraded Monitoring CR name
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: upgrade_monitoring_get_crds
        with:
          crd_location: ${{ inputs.repository_name}}/${{ env.PATH_TO_CHART}}/crds

      - name: Verify Monitoring upgrade
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: monitoring
          service_ready_max_retries: ${{ env.SERVICE_READY_MAX_RETRIES }}
          service_ready_retry_interval: ${{ env.SERVICE_READY_RETRY_INTERVAL }}
          test_completion_max_retries: ${{ env.TEST_COMPLETION_MAX_RETRIES }}
          test_completion_retry_interval: ${{ env.TEST_COMPLETION_RETRY_INTERVAL }}
          crd_list: ${{ steps.upgrade_monitoring_get_crds.outputs.crd_names }}
          monitoring_pipeline: true
          repository_name: ${{ inputs.repository_name }}

      - name: Collect Diagnostics Monitoring installation
        if: ${{ !cancelled() && steps.monitoring_upgrade.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: monitoring
          artifact_name: Upgrade_${{ matrix.test.upgrade.artifact_name }}
          service_branch: ${{ matrix.test.upgrade.version }}

      # == End ======= Specific steps for upgrade tests =======

  final-status-check:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [Monitoring-Test-Cases]
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false
      - name: Check job status
        uses: ./qubership-test-pipelines/actions/shared/check_job_status
        with:
          job_result: ${{ needs.Monitoring-Test-Cases.result }}
