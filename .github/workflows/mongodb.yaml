name: Reusable MongoDB Tests

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository with MongoDB operator
        required: false
        type: string
        default: Netcracker/qubership-mongodb-operator
      service_branch:
        description: Branch of qubership-mongodb-operator repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      scope:
        description: MongoDB Test Scope (pr or nightly)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      allure:
        description: Enable Allure report generation
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      repository_name:
        description: Repository with MongoDB operator
        required: false
        type: string
        default: Netcracker/qubership-mongodb-operator
      service_branch:
        description: Branch of qubership-mongodb-operator repository
        required: false
        type: string
        default: main
      pipeline_branch:
        description: Branch of qubership-test-pipelines repository
        type: string
        required: true
      runner_type:
        description: Runner type (self-hosted or ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      scope:
        description: MongoDB Test Scope (pr or nightly)
        type: string
        required: false
        default: pr
      skip_tests:
        description: Skip all tests (for doc-only changes)
        type: boolean
        required: false
        default: false
      allure:
        description: Enable Allure report generation
        type: boolean
        required: false
        default: false

    secrets:
      AWS_S3_ACCESS_KEY_ID:
        required: true
      AWS_S3_ACCESS_KEY_SECRET:
        required: true

env:
  namespace: mongodb
  path_to_chart_operator: operator/charts/helm/mongodb-operator
  path_to_chart_services: services/service/charts/helm/mongodb-services

jobs:
  prepare:
    if: ${{ !inputs.skip_tests }}
    runs-on: ${{ inputs.runner_type }}
    outputs:
      versions: ${{ steps.process-versions.outputs.versions }}
      matrix: ${{ steps.process-versions.outputs.matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-mongodb-operator
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Get latest tag
        id: get-latest-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ inputs.repository_name }}
        run: |
          LATEST_TAG=$(gh api repos/${REPO_NAME}/releases/latest --jq '.tag_name')
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Process versions file and matrix generation
        id: process-versions
        env:
          SCOPE: ${{ inputs.scope }}
          LATEST_TAG: ${{ steps.get-latest-tag.outputs.latest_tag }}
          SERVICE_BRANCH: ${{ inputs.service_branch }}
        working-directory: ${{ github.workspace }}/qubership-test-pipelines
        run: |
          chmod +x ./scripts/matrix.sh
          if [[ "$SCOPE" == "nightly" ]]; then
            CONFIG_FILE="./workflow-config/mongodb_nightly.yaml"
          elif [[ "$SCOPE" == "pr" ]]; then
            CONFIG_FILE="./workflow-config/mongodb.yaml"
          else
            echo "::error::Invalid scope parameter '$SCOPE'. Must be 'pr' or 'nightly'"
            exit 1
          fi
          ./scripts/matrix.sh "$LATEST_TAG" "$CONFIG_FILE" "$SERVICE_BRANCH"

  MongoDB-Test-Cases:
    if: ${{ !inputs.skip_tests }}
    needs: prepare
    runs-on: ${{ inputs.runner_type }}
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.test.name }}
    steps:
      - name: Print job parameters
        env:
          MATRIX_JSON: ${{ toJson(matrix.test) }}
        run: |
          echo "======== Job parameters ======="
          echo "$MATRIX_JSON"

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.service_branch }}
          repository: ${{ inputs.repository_name }}
          path: qubership-mongodb-operator
          persist-credentials: false

      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false

      - name: Create cluster
        uses: ./qubership-test-pipelines/actions/shared/create_cluster

      - name: Install Monitoring [${{ matrix.test.install.version }}]
        if: matrix.test.monitoring == true
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: monitoring_install
        with:
          path_to_template: templates/monitoring/vm_without_tests.yml
          service_branch: v0.88.0
          service_name: monitoring
          repository_name: Netcracker/qubership-monitoring-operator
          path_to_chart: charts/qubership-monitoring-operator
          namespace: monitoring
          restricted: false

      - name: Get Installed Monitoring CR name
        if: matrix.test.monitoring == true
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_monitoring_get_crds
        with:
          crd_location: Netcracker/qubership-monitoring-operator/charts/qubership-monitoring-operator/crds

      - name: Verify Monitoring installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        if: matrix.test.monitoring == true
        with:
          namespace: monitoring
          test_completion_max_retries: 40
          test_completion_retry_interval: 10s
          service_ready_max_retries: 80
          service_ready_retry_interval: 10s
          monitoring_pipeline: true
          repository_name: Netcracker/qubership-monitoring-operator
          crd_list: ${{ steps.install_monitoring_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics Monitoring installation
        if: ${{ !cancelled() && steps.monitoring_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: monitoring
          artifact_name: Install_Monitoring_${{ matrix.test.install.artifact_name }}
          service_branch: main

      # == Start ======= Specific steps for Allure report =======
      - name: Check Allure configuration
        if: matrix.test.allure == true && inputs.allure == false
        run: echo "::warning::Allure report generation has been forcibly disabled by the calling workflow (inputs.allure = false)"

      - name: Add s3 bucket for Allure report
        if: matrix.test.allure == true && inputs.allure == true
        # zizmor: ignore[template-injection]
        run: >-
          python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template_services }}'
          --path='robotTests/atpReport/enabled'
          --value='true'
          && python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template_services }}'
          --path='robotTests/atpReport/atpStorage/username'
          --value='${{ secrets.AWS_S3_ACCESS_KEY_ID }}'
          && python qubership-test-pipelines/scripts/update_yaml.py
          --file='qubership-test-pipelines/${{ matrix.test.install.template_services }}'
          --path='robotTests/atpReport/atpStorage/password'
          --value='${{ secrets.AWS_S3_ACCESS_KEY_SECRET }}'
      # == End ======= Specific steps for Allure report =======

      - name: Print operator install deployment parameters
        run: cat qubership-test-pipelines/${{ matrix.test.install.template_operator }}

      - name: Install MongoDB Operator [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: mongodb_operator_install
        with:
          path_to_template: ${{ matrix.test.install.template_operator }}
          service_branch: ${{ matrix.test.install.version }}
          deploy_mode: install
          service_name: mongodb-operator
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_operator }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Get Installed MongoDB Operator CRD name
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_mongodb_operator_get_crds
        with:
          crd_location: Netcracker/qubership-mongodb-operator/operator/charts/helm/mongodb-operator/crds

      - name: Verify MongoDB Operator installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 150
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_mongodb_operator_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics MongoDB Operator installation
        if: ${{ !cancelled() && steps.mongodb_operator_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: MongoDB_Operator_Install_${{ matrix.test.install.artifact_name }}
          service_branch: ${{ matrix.test.install.version }}

      - name: Print services install deployment parameters
        # zizmor: ignore[template-injection]
        run: cat qubership-test-pipelines/${{ matrix.test.install.template_services }}

      - name: Install MongoDB Services [${{ matrix.test.install.version }}]
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: mongodb_services_install
        with:
          path_to_template: ${{ matrix.test.install.template_services }}
          service_branch: ${{ matrix.test.install.version }}
          deploy_mode: install
          service_name: mongodb-services
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_services }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Get Installed MongoDB Services CRD name
        uses: ./qubership-test-pipelines/actions/shared/get_crds
        id: install_mongodb_services_get_crds
        with:
          crd_location: Netcracker/qubership-mongodb-operator/services/service/charts/helm/mongodb-services/crds

      - name: Verify MongoDB Services installation
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_mongodb_services_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics MongoDB Services installation
        if: ${{ !cancelled() && steps.mongodb_services_install.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: MongoDB_Services_Install_${{ matrix.test.install.artifact_name }}
          service_branch: ${{ matrix.test.install.version }}

      - name: Upgrade MongoDB Operator to [${{ matrix.test.upgrade.version }}]
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: mongodb_operator_upgrade
        with:
          path_to_template: ${{ matrix.test.upgrade.template_operator }}
          service_branch: ${{ matrix.test.upgrade.version }}
          deploy_mode: upgrade
          service_name: mongodb-operator
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_operator }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Verify MongoDB Operator upgrade
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_mongodb_operator_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics MongoDB Operator upgrade
        if: ${{ !cancelled() && steps.mongodb_operator_upgrade.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: MongoDB_Operator_Upgrade_${{ matrix.test.upgrade.artifact_name }}
          service_branch: ${{ matrix.test.upgrade.version }}

      - name: Upgrade MongoDB Services to [${{ matrix.test.upgrade.version }}]
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/helm_deploy
        id: mongodb_services_upgrade
        with:
          path_to_template: ${{ matrix.test.upgrade.template_services }}
          service_branch: ${{ matrix.test.upgrade.version }}
          deploy_mode: upgrade
          service_name: mongodb-services
          repository_name: ${{ inputs.repository_name }}
          path_to_chart: ${{ env.path_to_chart_services }}
          namespace: ${{ env.namespace }}
          restricted: ${{ matrix.test.restricted }}

      - name: Verify MongoDB Services upgrade
        if: matrix.test.sequence == 'upgrade'
        uses: ./qubership-test-pipelines/actions/shared/verify_installation
        with:
          namespace: ${{ env.namespace }}
          test_completion_max_retries: 50
          test_completion_retry_interval: 10s
          service_ready_max_retries: 50
          service_ready_retry_interval: 10s
          crd_list: ${{ steps.install_mongodb_services_get_crds.outputs.crd_names }}

      - name: Collect Diagnostics MongoDB Services upgrade
        if: ${{ !cancelled() && steps.mongodb_services_upgrade.conclusion != 'skipped' }}
        uses: ./qubership-test-pipelines/actions/shared/collect_diag_info
        with:
          namespace: ${{ env.namespace }}
          artifact_name: MongoDB_Services_Upgrade_${{ matrix.test.upgrade.artifact_name }}
          service_branch: ${{ matrix.test.upgrade.version }}

  final-status-check:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [MongoDB-Test-Cases]
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pipeline_branch }}
          repository: netcracker/qubership-test-pipelines
          path: qubership-test-pipelines
          persist-credentials: false
      - name: Check job status
        uses: ./qubership-test-pipelines/actions/shared/check_job_status
        with:
          job_result: ${{ needs.MongoDB-Test-Cases.result }}
