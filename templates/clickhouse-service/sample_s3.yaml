clickhouseOperator:
  image: altinity/clickhouse-operator:0.27.4
  metricsExporterImage: altinity/metrics-exporter:0.27.4
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
clickhouseCluster:
  image: ghcr.io/netcracker/qubership-clickhouse-258:main
  strictHealthCheck: false
  replicasCount: 3
  pvSize: 5Gi
  zookeeperHost: zookeeper.zookeeper.svc
  storageClassName: standard
  serviceMonitor: disable
  ingressHttp:
    host: clickhouse-cluster.qubership.com
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
  # DBaaS adapter authenticates as this user (must match dbaas.clickhouse in sample_sup_s3.yaml)
  users:
    #ncdbaasuser:
    nc_dbaas_user:
      profile: default
      password: pAssW0RD1
      networks/ip: "::/0"
backupDaemon:
  install: yes
  storage:
    remote: s3
    s3:
      access_key: ""
      secret_key: ""
      bucket: ""
      endpoint: https://s3.amazonaws.com
      force_path_style: true
      disable_ssl: false
      debug: true
clickhouseSecretMonitor:
  install: false
