clickhouseOperator:
  image: altinity/clickhouse-operator:0.27.4
  metricsExporterImage: altinity/metrics-exporter:0.27.4
  resources:
    limits:
      cpu: 201m
      memory: 201Mi
    requests:
      cpu: 101m
      memory: 101Mi
  metricsExporterResources:
    limits:
      cpu: 201m
      memory: 201Mi
    requests:
      cpu: 101m
      memory: 101Mi
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
clickhouseCluster:
  image: ghcr.io/netcracker/qubership-clickhouse-258:main
  strictHealthCheck: false
  replicasCount: 3
  pvSize: 5Gi
  zookeeperHost: zookeeper.zookeeper.svc
  storageClassName: standard
  serviceMonitor: disable
  ingressHttp:
    host: clickhouse-cluster.qubership.com
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
backupDaemon:
  install: yes
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
  storage:
    remote: s3
    s3:
      access_key: ""
      secret_key: ""
      bucket: ""
      endpoint: https://s3.amazonaws.com
      force_path_style: true
      disable_ssl: false
      debug: true
  orchestrator:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    pvSize: 2Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    securityContext:
      runAsUser: 101
      runAsGroup: 101
dbaas:
  install: true
  aggregator:
    registrationAddress: http://dbaas-aggregator.dbaas:8080
    registrationUsername: cluster-dba
    registrationPassword: ""
  labels:
    clusterName: clickhouse
  clickhouse:
    username: nc_dbaas_user
    password: pAssW0RD1
  adapter:
    username: dbaas-aggregator
    password: ""
integrationTests:
  install: true
  tags: smoke
  timeoutBeforeStart: 100
clickhouseSecretMonitor:
  install: false
