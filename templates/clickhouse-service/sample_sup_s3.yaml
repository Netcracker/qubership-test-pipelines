clickhouseCluster:
  serviceMonitor: disable
backupDaemon:
  install: true
  storage:
    remote: s3
    s3:
      access_key: ""
      bucket: ""
      endpoint: https://s3.amazonaws.com
      secret_key: ""
      debug: true
      disable_ssl: false
      force_path_style: true
  orchestrator:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    pvSize: 2Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    envs:
      BACKUP_SCHEDULE: 0 * * * *
      EVICTION_POLICY: 7d/7d,1y/delete
      # The orchestrator builds its own S3 client for granular backups / .evictlock handling.
      # It reads credentials from these env variables only (the mounted secret
      # /var/run/secrets/clickhouse/s3-remote-storage-credentials is not used for that),
      # otherwise the request fails with "static credentials are empty".
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
    securityContext:
      runAsUser: 101
      runAsGroup: 101
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
dbaas:
  install: true
  aggregator:
    registrationAddress: http://dbaas-aggregator.dbaas:8080
    registrationUsername: cluster-dba
    registrationPassword: ""
  labels:
    clusterName: clickhouse
  # Must match the ClickHouse user created in CHI (clickhouseCluster.users in sample.yaml)
  clickhouse:
    username: ncdbaasuser
    password: pAssW0RD1
  adapter:
    username: dbaas-aggregator
    password: ""
integrationTests:
  install: true
  tags: backup
