clickhouseOperator:
  image: altinity/clickhouse-operator:0.27.4
  metricsExporterImage: altinity/metrics-exporter:0.27.4
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
clickhouseCluster:
  image: ghcr.io/netcracker/qubership-clickhouse-258:main
  strictHealthCheck: false
  replicasCount: 3
  pvSize: 5Gi
  zookeeperHost: zookeeper.zookeeper.svc
  storageClassName: standard
  serviceMonitor: disable
  ingressHttp:
    host: clickhouse-cluster.qubership.com
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
backupDaemon:
  install: yes
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
  storage:
    remote: none
  orchestrator:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    pvSize: 2Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    envs:
      BACKUP_SCHEDULE: 0 * * * *
      EVICTION_POLICY: 7d/7d,1y/delete
    securityContext:
      runAsUser: 101
      runAsGroup: 101
dbaas:
  install: true
  aggregator:
    registrationAddress: http://dbaas-aggregator.dbaas:8080
    registrationUsername: cluster-dba
    registrationPassword: ""
  labels:
    clusterName: clickhouse
  clickhouse:
    username: nc_dbaas_user
    password: pAssW0RD1
  adapter:
    username: dbaas-aggregator
    password: ""
integrationTests:
  install: true
  tags: smoke
  timeoutBeforeStart: 100
clickhouseSecretMonitor:
  install: false
