clickhouseOperator:
  image: altinity/clickhouse-operator:0.27.4
  metricsExporterImage: altinity/metrics-exporter:0.27.4
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
clickhouseCluster:
  image: ghcr.io/netcracker/qubership-clickhouse-258:main
  strictHealthCheck: false
  replicasCount: 3
  pvSize: 5Gi
  zookeeperHost: zookeeper.zookeeper.svc
  storageClassName: standard
  serviceMonitor: disable
  ingressHttp:
    host: clickhouse-cluster.qubership.com
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
  users:
    ncdbaasuser:
      profile: default
      password: pAssW0RD1
      networks/ip: "::/0"
      grants/query: "GRANT ALL ON *.* WITH GRANT OPTION"
clickhouseSecretMonitor:
  install: false
backupDaemon:
  install: true
  storage:
    remote: none
  orchestrator:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    pvSize: 2Gi
    storageClassName: standard
    accessModes:
      - ReadWriteOnce
    envs:
      BACKUP_SCHEDULE: 0 * * * *
      EVICTION_POLICY: 7d/7d,1y/delete
    securityContext:
      runAsUser: 101
      runAsGroup: 101
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
