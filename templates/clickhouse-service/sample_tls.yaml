clickhouseOperator:
  image: altinity/clickhouse-operator:0.27.4
  metricsExporterImage: altinity/metrics-exporter:0.27.4
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
      runAsUser: 101
      runAsGroup: 101
clickhouseCluster:
  image: ghcr.io/netcracker/qubership-clickhouse-258:main
  strictHealthCheck: false
  replicasCount: 3
  pvSize: 5Gi
  zookeeperHost: zookeeper.zookeeper.svc
  storageClassName: standard
  serviceMonitor: disable
  ingressHttp:
    host: clickhouse-cluster.qubership.com
  securityContext:
    container:
      runAsUser: 101
      runAsGroup: 101
    pod:
      fsGroup: 101
  users:
    ncdbaasuser:
      profile: default
      password: pAssW0RD1
      networks/ip: "::/0"
tls:
  enabled: true
  certificateSecretName: ch-cert
  generateCerts:
    enabled: true
    clusterIssuerName: test-clusterissuer
clickhouseSecretMonitor:
  install: false
