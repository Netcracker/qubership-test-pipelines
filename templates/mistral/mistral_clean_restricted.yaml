mistral:
  tls:
    enabled: false
name: mistral-service
mistralCommonParams:
  postgres:
    dbName: mistral_app
    host: pg-patroni.postgres-infra.svc
    port: 5432
  rabbit:
    host: rabbitmq.rabbitmq.svc
    port: 5672
    vhost: mistral_app
  kafkaNotifications:
    enabled: false
    securityEnabled: false
  auth:
    enable: false
  idpServer: http://identity-management.security-services2.svc.cluster.local:8080
  securityProfile: dev
mistralApi:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralMonitoring:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
  prometheusEnabled: false
mistralExecutor:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralEngine:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralNotifier:
  replicas: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
secrets:
  kafkaSaslPlainUsername: client
  kafkaSaslPlainPassword: client
  idpRegistrationToken: ""
  pgAdminPassword: paSSw0rd
  pgAdminUser: postgres
  pgPassword: ci_mistral
  pgUser: ci_mistral
  rabbitAdminPassword: admin
  rabbitAdminUser: admin
  rabbitPassword: admin
  rabbitUser: admin
integrationTests:
  enabled: true
  runTestsOnly: false
  waitTestResultOnJob: true
  mistralReadyTimeout: 800
  runAsUser: 5000
bluegreenAgent:
  enabled: true
ESCAPE_SEQUENCE: true
CLOUD_CORE_INTEGRATION_ENABLED: false
DISABLE_CRD: true
CUSTOM_TIMEOUT_MIN: 30
