# Mistral clean install (main) - YAML version of mistral_clean.txt
# Dependencies are installed by the workflow before this template:
#   PostgreSQL: templates/pgskipper/patroni-core-lite.yaml (pg-patroni.postgres-infra)
#   RabbitMQ:   templates/rabbitmq-service/rabbitmq_clean_sc_lite.yml (rabbitmq.rabbitmq)
mistral:
  tls:
    enabled: false
  ingress:
    enabled: true
    host: mistral-mistral-ci.saas-rnd-cap-02.managed.netcracker.cloud
name: mistral-service
mistralCommonParams:
  postgres:
    dbName: mistral_app1
    host: pg-patroni.postgres-infra.svc
    port: "5432"
  rabbit:
    host: rabbitmq.rabbitmq.svc
    port: "5672"
    vhost: mistral_app1
  kafkaNotifications:
    enabled: false
    host: kafka.kafka-service
    topic: mistral_9
    consumerGroupId: mistral_9_notification
    securityEnabled: false
  auth:
    enable: false
  idpServer: http://identity-management.security-services2.svc.cluster.local:8080
  securityProfile: dev
mistralApi:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralMonitoring:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
  prometheusEnabled: false
mistralExecutor:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralEngine:
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralNotifier:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 500Mi
secrets:
  kafkaSaslPlainUsername: client
  kafkaSaslPlainPassword: client
  idpRegistrationToken: ""
  pgAdminPassword: paSSw0rd
  pgAdminUser: postgres
  pgPassword: ci_mistral
  pgUser: ci_mistral
  rabbitAdminPassword: admin
  rabbitAdminUser: admin
  rabbitPassword: admin
  rabbitUser: admin
integrationTests:
  enabled: true
  runTestsOnly: false
  waitTestResultOnJob: true
  mistralReadyTimeout: 800
  runAsUser: 5000
bluegreenAgent:
  enabled: true
ESCAPE_SEQUENCE: true
CLOUD_CORE_INTEGRATION_ENABLED: false
CUSTOM_TIMEOUT_MIN: 30
DCL_CONFIG_ARGOCD_WAIT_TIMEOUT: 20
