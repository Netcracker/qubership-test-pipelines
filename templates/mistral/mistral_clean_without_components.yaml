mistral:
  tls:
    enabled: false
name: mistral-service
mistralCommonParams:
  postgres:
    dbName: mistral_regr
    host: pg-patroni.postgres-infra.svc
    port: 5432
  rabbit:
    host: rabbitmq.rabbitmq.svc
    port: 5672
    vhost: mistral_regr
  kafkaNotifications:
    enabled: false
  auth:
    enable: false
  securityProfile: dev
mistralApi:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 1000m
      memory: 1000Mi
mistralMonitoring:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
  prometheusEnabled: false
mistralExecutor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 2000m
      memory: 2000Mi
mistralEngine:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1000Mi
    limits:
      cpu: 2000m
      memory: 2000Mi
mistralNotifier:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 500Mi
secrets:
  pgAdminPassword: paSSw0rd
  pgAdminUser: postgres
  rabbitAdminPassword: admin
  rabbitAdminUser: admin
integrationTests:
  enabled: true
  runTestsOnly: false
  waitTestResultOnJob: true
  mistralReadyTimeout: 1000
  runAsUser: 5000
bluegreenAgent:
  enabled: true
ESCAPE_SEQUENCE: true
CLOUD_CORE_INTEGRATION_ENABLED: false
CUSTOM_TIMEOUT_MIN: 30
