mistral:
  tls:
    enabled: false
name: mistral-service
labels:
  qa: test
mistralCommonParams:
  postgres:
    dbName: mistral_app
    host: pg-patroni.postgres-infra.svc
    port: 5432
  rabbit:
    host: rabbitmq.rabbitmq.svc
    port: 5672
    vhost: mistral_app
  kafkaNotifications:
    enabled: false
    host: kafka.kafka-service
    topic: mistral_9
    consumerGroupId: mistral_9_notification
    securityEnabled: false
  auth:
    enable: false
  idpServer: http://identity-management.security-services2.svc.cluster.local:8080
  securityProfile: dev
mistralApi:
  replicas: 2
  resources:
    requests:
      cpu: 300m
      memory: 600Mi
    limits:
      cpu: 1200m
      memory: 1200Mi
mistralMonitoring:
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 250Mi
    limits:
      cpu: 600m
      memory: 600Mi
  prometheusEnabled: false
mistralExecutor:
  replicas: 1
  resources:
    requests:
      cpu: 300m
      memory: 600Mi
    limits:
      cpu: 2400m
      memory: 2400Mi
mistralEngine:
  replicas: 2
  resources:
    requests:
      cpu: 600m
      memory: 1200Mi
    limits:
      cpu: 2400m
      memory: 2400Mi
mistralNotifier:
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 250Mi
    limits:
      cpu: 600m
      memory: 600Mi
secrets:
  kafkaSaslPlainUsername: client
  kafkaSaslPlainPassword: client
  idpRegistrationToken: ""
  pgAdminPassword: paSSw0rd
  pgAdminUser: postgres
  pgPassword: ci_mistral
  pgUser: ci_mistral
  rabbitAdminPassword: admin
  rabbitAdminUser: admin
  rabbitPassword: admin
  rabbitUser: admin
integrationTests:
  enabled: true
  runTestsOnly: false
  waitTestResultOnJob: true
  mistralReadyTimeout: 1000
  runAsUser: 5000
bluegreenAgent:
  enabled: true
ESCAPE_SEQUENCE: true
CLOUD_CORE_INTEGRATION_ENABLED: false
CUSTOM_TIMEOUT_MIN: 30
