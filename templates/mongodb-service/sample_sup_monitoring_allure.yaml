operator:
  image: ghcr.io/netcracker/mongodb-supplementary:main
  initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
backup:
  install: true
  storage:
    size: 4Gi
    storageClasses:
      - standard
dbaas:
  install: true
prometheusExporter:
  install: false
# set 'prometheusExporter' to 'true'
# after fix https://github.com/Netcracker/qubership-mongodb-operator/issues/109
robotTests:
  install: true
  tags: smoke
