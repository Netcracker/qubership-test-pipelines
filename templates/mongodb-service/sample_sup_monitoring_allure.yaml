operator:
  image: ghcr.io/netcracker/mongodb-supplementary:main
  initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
backup:
  install: true
  storage:
    size: 4Gi
    storageClasses:
      - standard
dbaas:
  install: true
prometheusExporter:
  install: true
robotTests:
  install: true
  tags: smoke
  atpReport:
    enabled: false
    atpStorage:
      provider: aws
      serverUrl: s3.amazonaws.com
      bucket: qstp-results
      region: us-east-1
      username: ""
      password: ""
