operator:
  image: ghcr.io/netcracker/mongodb-supplementary:main
  initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
backup:
  install: true
  storageDirectory: /backup-storage
  storage:
    size: 1Gi
    storageClasses:
      - standard
  s3:
    enabled: true
    secretName: mongo-backup-s3-credentials
    bucketName: ""
    accessKeyId: ""
    accessKeySecret: ""
    endpointUrl: https://s3.amazonaws.com
dbaas:
  install: true
  dockerImage: ghcr.io/netcracker/mongodb-docker-dbaas-adapter:main
prometheusExporter:
  install: false
robotTests:
  install: true
  dockerImage: ghcr.io/netcracker/mongodb-docker-tests:main
  tags: backup
