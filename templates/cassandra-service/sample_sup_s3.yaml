operator:
    image: ghcr.io/netcracker/cassandra-supplementary:main
    initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
cassandra:
    install: true
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 3Gi
    deploymentSchema:
      dataCenters:
        - name: dc1
          replicas: 3
          seeds: 1
          storage:
            size: 4Gi
            storageClasses:
              - standard
backupDaemon:
    install: true
    resources:
      limits:
        memory: 1Gi
        cpu: 250m
    storage:
      size: 1Gi
      storageClasses:
        - standard
    storageDirectory: /cassandra/backup-storage
    s3:
      enabled: true
      secretName: cassandra-backup-s3-credentials
      bucketName: ""
      accessKeyId: ""
      accessKeySecret: ""
dbaas:
    install: true
    dockerImage: ghcr.io/netcracker/cassandra-docker-dbaas-adapter:main
    aggregator:
      dbaasAggregatorRegistrationAddress: http://dbaas-aggregator.dbaas-infra:8080
monitoringAgent:
    install: false
robotTests:
    install: true
    dockerImage: ghcr.io/netcracker/cassandra-docker-tests:2.16.1
    tags: smoke
    iteration: "1"
consulRegistration:
    Enabled: false
    Port: "8500"
waitTimeout: 3000
