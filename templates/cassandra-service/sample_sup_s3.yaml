operator:
    image: ghcr.io/netcracker/cassandra-supplementary:main
    initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
cassandra:
    install: true
    deploymentSchema:
      dataCenters:
        - name: dc1
          replicas: 3
          seeds: 1
          storage:
            size: 4Gi
            storageClasses:
              - standard
backupDaemon:
    install: true
    storage:
      size: 4Gi
      storageClasses:
        - standard
    s3:
      keyId: ""
      keySecret: ""
      bucket: ""
dbaas:
  install: true
  dockerImage: ghcr.io/netcracker/cassandra-docker-dbaas-adapter:main
monitoringAgent:
    install: false
robotTests:
    install: true
    dockerImage: ghcr.io/netcracker/cassandra-docker-tests:2.16.1
    tags: smoke
