# Cassandra Services Monitoring + Allure values template - placeholder
# Copy Monitoring + Allure parameters from qubership-cassandra-operator repository samples
operator:
    image: ghcr.io/netcracker/cassandra-supplementary:main
    initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
cassandra:
    install: true
    deploymentSchema:
      dataCenters:
        - name: dc1
          replicas: 3
          seeds: 1
          storage:
            size: 4Gi
            storageClasses:
              - standard
backupDaemon:
    install: true
    storage:
      size: 4Gi
      storageClasses:
        - standard
dbaas:
    install: false
monitoringAgent:
    install: true
robotTests:
    install: true
    tags: smoke
    iteration: "1"
consulRegistration:
    Enabled: false
    Port: "8500"
integrationTests:
    atpReport:
      atpStorage:
        username: ""
        password: ""
