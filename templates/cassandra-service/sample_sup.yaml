operator:
    image: ghcr.io/netcracker/cassandra-supplementary:main
    initImage: ghcr.io/netcracker/qubership-credential-manager:v0.0.15
cassandra:
    install: true
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 3Gi
    deploymentSchema:
      dataCenters:
        - name: dc1
          replicas: 3
          seeds: 1
          storage:
            size: 4Gi
            storageClasses:
              - standard
backupDaemon:
    install: true
    resources:
      requests:
        cpu: 250m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      size: 4Gi
      storageClasses:
        - standard
dbaas:
    install: true
    dockerImage: ghcr.io/netcracker/cassandra-docker-dbaas-adapter:main
    aggregator:
      dbaasAggregatorRegistrationAddress: http://dbaas-aggregator.dbaas-infra:8080
monitoringAgent:
    install: false
robotTests:
    install: true
    dockerImage: ghcr.io/netcracker/cassandra-docker-tests:2.16.1
    tags: smoke
    iteration: "1"
consulRegistration:
    Enabled: false
    Port: "8500"
