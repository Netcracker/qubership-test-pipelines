# Workaround for the nightly "Clean previous tag, Upgrade to main" scenario.
# Previous releases of qubership-monitoring-operator grant the
# monitoring-tests ServiceAccount grafanadashboards RBAC only in the legacy
# "integreatly.org" API group, while the integration tests create dashboards in
# "grafana.integreatly.org" (added on main). This ClusterRole/ClusterRoleBinding
# closes that gap so the previous release's tests can create Grafana dashboards.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoring-tests-grafana-dashboards
rules:
  - apiGroups:
      - "integreatly.org"
    resources:
      - grafanadashboards
      - grafanadashboards/status
      - grafanas
      - grafanas/status
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
      - "delete"
      - "create"
  - apiGroups:
      - "grafana.integreatly.org"
    resources:
      - grafanadashboards
      - grafanadashboards/status
      - grafanas
      - grafanas/status
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
      - "delete"
      - "create"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoring-tests-grafana-dashboards
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoring-tests-grafana-dashboards
subjects:
  - kind: ServiceAccount
    name: monitoring-tests
    namespace: monitoring
